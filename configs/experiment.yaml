experiment:
  date_column: "date"
  test_fraction: 0.20
  targets: ["Avg_Elapsed_Time", "Avg_Remaining_Time"]
  horizons: [1, 3, 7]
  seeds: [1, 7, 13, 21, 42, 66, 77, 88, 99, 123]

features:
  target_lags: [1, 2, 3, 4, 5, 6, 7]
  actor_lags: [1, 2, 3, 4, 5, 6, 7]
  rolling_windows: [3, 7, 14]
  include_causal_peak_flag: false
  max_selected_regressors: 25

models:
  xgboost:
    n_estimators: [1000, 1500]
    learning_rate: [0.05, 0.1, 0.2]
    max_depth: [3, 5, 6]
    subsample: [0.9]
    colsample_bytree: [0.9]
  lightgbm:
    n_estimators: [1000, 1500]
    learning_rate: [0.05, 0.1, 0.2]
    max_depth: [3, 5, 6]
    subsample: [0.9]
    colsample_bytree: [0.9]
  recurrent:
    sequence_length: 15
    hidden_units: [64, 128, 256, 512]
    dense_units: [32, 64, 128, 256]
    dropout: [0.2, 0.3]
    batch_size: [16, 32]
    cnn_kernel_size: [3, 5]
    cnn_filters: [32, 64]
    cnn_pool_size: [2, 3]
    attention_heads: 4
    attention_key_dim: 32

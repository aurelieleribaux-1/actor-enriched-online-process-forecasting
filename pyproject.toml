[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actor-enriched-process-forecasting"
version = "0.1.0"
description = "Actor-enriched multi-horizon forecasting of open-case process performance."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Aurélie Leribaux"}]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "joblib>=1.3"
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "lightgbm>=4.3"]
deep = ["tensorflow>=2.15", "shap>=0.45"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
